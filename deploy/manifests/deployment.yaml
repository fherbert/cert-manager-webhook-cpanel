apiVersion: apps/v1
kind: Deployment
metadata:
  name: cert-manager-webhook-cpanel
  namespace: cert-manager
  labels:
    app: cert-manager-webhook-cpanel
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cert-manager-webhook-cpanel
  template:
    metadata:
      labels:
        app: cert-manager-webhook-cpanel
    spec:
      serviceAccountName: cert-manager-webhook-cpanel
      containers:
        - name: webhook
          image: cert-manager-webhook-cpanel:latest
          imagePullPolicy: IfNotPresent
          args:
            - --tls-cert-file=/tls/tls.crt
            - --tls-private-key-file=/tls/tls.key
            - --secure-port=8443
            - -v=2
          env:
            - name: GROUP_NAME
              value: "acme.cpanel.webhook"
          ports:
            - name: https
              containerPort: 8443
              protocol: TCP
          livenessProbe:
            httpGet:
              scheme: HTTPS
              path: /healthz
              port: https
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              scheme: HTTPS
              path: /healthz
              port: https
            initialDelaySeconds: 5
            periodSeconds: 5
          volumeMounts:
            - name: certs
              mountPath: /tls
              readOnly: true
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 1000
            capabilities:
              drop:
                - ALL
      volumes:
        - name: certs
          secret:
            secretName: cert-manager-webhook-cpanel-webhook-tls
