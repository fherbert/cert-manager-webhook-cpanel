apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: cert-manager-webhook-cpanel-webhook-tls
  namespace: cert-manager
  labels:
    app: cert-manager-webhook-cpanel
spec:
  secretName: cert-manager-webhook-cpanel-webhook-tls
  duration: 8760h
  renewBefore: 720h
  issuerRef:
    name: cert-manager-webhook-cpanel-selfsign
    kind: Issuer
  dnsNames:
    - cert-manager-webhook-cpanel
    - cert-manager-webhook-cpanel.cert-manager
    - cert-manager-webhook-cpanel.cert-manager.svc

---
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: cert-manager-webhook-cpanel-selfsign
  namespace: cert-manager
  labels:
    app: cert-manager-webhook-cpanel
spec:
  selfSigned: {}
