apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: cert-manager-webhook-cpanel:domain-solver
  labels:
    app: cert-manager-webhook-cpanel
rules:
  - apiGroups:
      - acme.cpanel.webhook
    resources:
      - '*'
    verbs:
      - create

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: cert-manager-webhook-cpanel:domain-solver
  labels:
    app: cert-manager-webhook-cpanel
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cert-manager-webhook-cpanel:domain-solver
subjects:
  - apiGroup: ""
    kind: ServiceAccount
    name: cert-manager
    namespace: cert-manager
