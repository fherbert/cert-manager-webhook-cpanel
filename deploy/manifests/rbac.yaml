apiVersion: v1
kind: ServiceAccount
metadata:
  name: cert-manager-webhook-cpanel
  namespace: cert-manager
  labels:
    app: cert-manager-webhook-cpanel

---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: cert-manager-webhook-cpanel:secret-reader
  namespace: cert-manager
  labels:
    app: cert-manager-webhook-cpanel
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list", "watch"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: cert-manager-webhook-cpanel:secret-reader
  namespace: cert-manager
  labels:
    app: cert-manager-webhook-cpanel
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: cert-manager-webhook-cpanel:secret-reader
subjects:
  - apiGroup: ""
    kind: ServiceAccount
    name: cert-manager-webhook-cpanel
    namespace: cert-manager

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: cert-manager-webhook-cpanel:flowcontrol-solver
  labels:
    app: cert-manager-webhook-cpanel
rules:
  - apiGroups:
      - "flowcontrol.apiserver.k8s.io"
    resources:
      - "prioritylevelconfigurations"
      - "flowschemas"
    verbs:
      - "list"
      - "watch"

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: cert-manager-webhook-cpanel:flowcontrol-solver
  labels:
    app: cert-manager-webhook-cpanel
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cert-manager-webhook-cpanel:flowcontrol-solver
subjects:
  - apiGroup: ""
    kind: ServiceAccount
    name: cert-manager-webhook-cpanel
    namespace: cert-manager
